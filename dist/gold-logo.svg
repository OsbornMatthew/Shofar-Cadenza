<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Obsidian Dark Base -->
  <rect width="512" height="512" rx="128" fill="#070709"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Subtle Inner Circular Disc -->
  <circle cx="256" cy="256" r="215" fill="#0d0d12" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Radiant Gold Music Waves Around Note -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.25"/>

  <!-- Luxury Modern Music Note (Flat Gold #D4AF37) -->
  <g fill="#D4AF37" stroke="#D4AF37" stroke-linejoin="round">
    <!-- Top Connecting Music Beam -->
    <path d="M190 155 L345 115 L345 160 L190 200 Z"/>

    <!-- Left Note Stem -->
    <rect x="190" y="155" width="22" height="195" rx="11"/>

    <!-- Right Note Stem -->
    <rect x="323" y="115" width="22" height="195" rx="11"/>

    <!-- Left Note Head (Angled Oval with Core) -->
    <ellipse cx="168" cy="350" rx="46" ry="34" transform="rotate(-24 168 350)"/>

    <!-- Right Note Head (Angled Oval with Core) -->
    <ellipse cx="301" cy="310" rx="46" ry="34" transform="rotate(-24 301 310)"/>
  </g>

  <!-- Inner Dark Note Accents -->
  <ellipse cx="168" cy="350" rx="16" ry="10" transform="rotate(-24 168 350)" fill="#0d0d12"/>
  <ellipse cx="301" cy="310" rx="16" ry="10" transform="rotate(-24 301 310)" fill="#0d0d12"/>

  <!-- Subtle Modern Equalizer Accent Bars Below -->
  <g stroke="#D4AF37" stroke-width="6" stroke-linecap="round">
    <line x1="216" y1="425" x2="216" y2="445" stroke-opacity="0.8"/>
    <line x1="236" y1="412" x2="236" y2="445"/>
    <line x1="256" y1="400" x2="256" y2="445"/>
    <line x1="276" y1="412" x2="276" y2="445"/>
    <line x1="296" y1="425" x2="296" y2="445" stroke-opacity="0.8"/>
  </g>
</svg>
