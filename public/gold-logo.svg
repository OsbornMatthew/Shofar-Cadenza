<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Obsidian Canvas -->
  <rect width="512" height="512" rx="140" fill="#08080B"/>
  <rect x="14" y="14" width="484" height="484" rx="126" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Ultra-Modern Geometric Sound Spectrum Emblem (Flat Gold #D4AF37) -->
  <g fill="#D4AF37" stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bar 1 (Left accent) -->
    <rect x="120" y="216" width="36" height="80" rx="18" fill="#D4AF37"/>

    <!-- Bar 2 (Mid-Left pulse) -->
    <rect x="180" y="156" width="36" height="200" rx="18" fill="#D4AF37"/>

    <!-- Bar 3 (Center High-Fidelity Crest) -->
    <rect x="240" y="100" width="36" height="312" rx="18" fill="#D4AF37"/>

    <!-- Bar 4 (Mid-Right pulse) -->
    <rect x="300" y="156" width="36" height="200" rx="18" fill="#D4AF37"/>

    <!-- Bar 5 (Right accent) -->
    <rect x="360" y="216" width="36" height="80" rx="18" fill="#D4AF37"/>

    <!-- Modern Central Cadenza Diamond Accent -->
    <polygon points="258,68 270,82 258,96 246,82" fill="#D4AF37"/>
    <polygon points="258,416 270,430 258,444 246,430" fill="#D4AF37"/>
  </g>
</svg>
